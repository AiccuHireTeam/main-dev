services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recruitment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  recruitment_pgdata:
