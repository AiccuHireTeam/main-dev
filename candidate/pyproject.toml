[project]
name = "aiccuhire-resume-intake"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "email-validator>=2,<3", "lxml>=5,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE"]
