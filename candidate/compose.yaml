services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: resume
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - resume_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U resume -d resume"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resume:${DB_PASSWORD}@postgres:5432/resume
    command: [python, -m, app.migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resume:${DB_PASSWORD}@postgres:5432/resume
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resume:${DB_PASSWORD}@postgres:5432/resume
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 90s
volumes:
  resume_db:
